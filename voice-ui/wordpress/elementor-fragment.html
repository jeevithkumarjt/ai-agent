<!-- Tryvium Voice UI — Elementor fragment
  --------------------------------------------------------------------------
  Paste this into an Elementor "HTML" widget. The icon sprite and all wiring
  are injected by app.js at boot — no inline scripts or markup required.
  Enqueue build/voice-ui.min.css + voice-ui.min.js (see functions snippet).
-->
<div class="vui-root">
  <div class="vui-bg" role="presentation" aria-hidden="true"></div>
  <div class="vui-app-main">
    <section class="vui-hero">
      <div class="vui-container">
        <div class="vui-hero__grid">
          <div class="vui-hero__copy">
            <p class="vui-overline vui-enter" style="--vui-enter-delay:0ms">Talk, type, get answers</p>
            <h1 class="vui-hero__title vui-enter" style="--vui-enter-delay:70ms">Your voice, served instantly.</h1>
            <p class="vui-lead vui-enter" style="--vui-enter-delay:140ms">A premium AI voice experience for your front desk — natural, fast, on-brand.</p>
            <div class="vui-hero__cta vui-enter" style="--vui-enter-delay:210ms">
              <button type="button" class="vui-btn vui-btn--primary"><span class="vui-btn__label">Start a call</span><svg class="vui-btn__icon" aria-hidden="true"><use href="#icon-phone"></use></svg></button>
              <button type="button" class="vui-btn vui-btn--ghost">Browse scenarios</button>
            </div>
          </div>
          <div class="vui-hero__visual">
            <div class="vui-hero__glow" aria-hidden="true"></div>
            <div class="vui-hero__card vui-enter" style="--vui-enter-delay:280ms">
              <div class="vui-hero__bar-track"><div class="vui-hero__bar"></div></div>
              <div class="vui-hero__status"><span class="vui-status-dot"></span><span>Assistant online</span></div>
              <div class="vui-hero__float vui-hero__float--a" aria-hidden="true">Scheduled for you</div>
              <div class="vui-hero__float vui-hero__float--b" aria-hidden="true">Claim filed · 48h</div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="vui-section vui-section--md" aria-labelledby="vui-scenarios-title">
      <div class="vui-container">
        <h2 id="vui-scenarios-title" class="vui-section-title">Pick a scenario</h2>
        <div class="vui-carousel" role="region" aria-label="Voice scenarios"></div>
      </div>
    </section>
  </div>
</div>
