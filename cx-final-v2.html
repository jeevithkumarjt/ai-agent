<style>
.voice{position:relative!important;overflow:visible!important}
.voice .elementor-icon{transition:.15s}
.voice:hover .elementor-icon{border-color:#F26E26!important}
.voice.is-playing .elementor-icon{background:linear-gradient(135deg,#F26E26,#FBAB18)!important;border-color:transparent!important}
.voice.is-playing .elementor-icon svg path{stroke:#fff!important}
.elementor-element:has(> .voice){overflow:visible!important}

.cx-toolbar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  display:none;flex-direction:column;align-items:stretch;
  background:#1a1a1a;border-radius:22px;padding:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  z-index:99999;font-family:-apple-system,BlinkMacSystemFont,sans-serif
}
.cx-toolbar.active{display:flex}
.cx-toolbar-row{display:flex;align-items:center;gap:2px}

.cx-tb-btn{
  width:34px;height:34px;border:none;border-radius:50%;
  background:transparent;color:#ccc;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0;padding:0
}
.cx-tb-btn svg{width:14px;height:14px}
.cx-tb-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.cx-tb-btn.primary{background:linear-gradient(135deg,#F26E26,#FBAB18);color:#fff;width:36px;height:36px}
.cx-tb-btn.primary:hover{opacity:.9}

.cx-tb-divider{width:1px;height:18px;background:rgba(255,255,255,.15);margin:0 4px;flex-shrink:0}

.cx-tb-voice{
  display:flex;align-items:center;gap:4px;border:none;background:transparent;
  color:#ddd;font-size:12px;padding:6px 10px;border-radius:20px;cursor:pointer;
  white-space:nowrap
}
.cx-tb-voice:hover{background:rgba(255,255,255,.1)}
.cx-tb-voice svg{width:12px;height:12px}

.cx-tb-speed{
  border:none;background:transparent;color:#ddd;font-size:11px;
  padding:6px 8px;border-radius:20px;cursor:pointer;flex-shrink:0
}
.cx-tb-speed:hover{background:rgba(255,255,255,.1)}

.cx-progress-track{height:3px;background:rgba(255,255,255,.12);border-radius:2px;margin-top:6px;overflow:hidden}
.cx-progress-fill{height:100%;background:linear-gradient(135deg,#F26E26,#FBAB18);width:0%;transition:width .25s ease}

.cx-voice-panel{
  position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  background:#1a1a1a;border-radius:12px;padding:6px;width:170px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);display:none
}
.cx-voice-panel.active{display:block}
.cx-voice-opt{padding:9px 12px;border-radius:8px;font-size:13px;color:#ddd;cursor:pointer;transition:.1s}
.cx-voice-opt:hover{background:rgba(255,255,255,.08)}
.cx-voice-opt.selected{background:linear-gradient(135deg,#F26E26,#FBAB18);color:#fff;font-weight:500}

/* ===== MODAL ===== */
.cx-modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:100000;padding:20px;backdrop-filter:blur(4px)
}
.cx-modal{
  background:#fff;border-radius:16px;
  max-width:380px;width:100%;position:relative;
  max-height:80vh;overflow:hidden;
  animation:cxFade .2s cubic-bezier(.16,1,.3,1);
  box-shadow:0 24px 60px rgba(0,0,0,.18)
}
@keyframes cxFade{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

.cx-m-header{
  padding:20px 22px 16px;display:flex;align-items:center;justify-content:space-between
}
.cx-m-title{margin:0;font-size:16px;font-weight:700;color:#1a1a1a}
.cx-m-sub{margin:0;font-size:12px;color:#999;font-weight:400}
.cx-modal-close{
  width:28px;height:28px;border-radius:8px;border:none;
  background:#f5f5f5;color:#666;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:.15s;flex-shrink:0
}
.cx-modal-close:hover{background:#eee;color:#333}
.cx-m-body{padding:0 22px 22px}

/* Share */
.cx-share-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.cx-share-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 8px;border-radius:12px;border:1px solid #eee;
  background:#fafafa;text-decoration:none;color:#555;font-size:11px;font-weight:500;
  transition:.15s;cursor:pointer
}
.cx-share-btn svg{width:20px;height:20px;flex-shrink:0}
.cx-share-btn:hover{border-color:transparent;color:#fff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.cx-share-btn.linkedin:hover{background:#0A66C2}
.cx-share-btn.x:hover{background:#000}
.cx-share-btn.whatsapp:hover{background:#25D366}
.cx-share-btn.email:hover{background:#EA4335}
.cx-share-btn.telegram:hover{background:#0088CC}
.cx-share-btn.copy-link:hover{background:linear-gradient(135deg,#F26E26,#FBAB18)}

.cx-divider-line{height:1px;background:#f0f0f0;margin:14px 0}

.cx-link-box{display:flex;gap:8px}
.cx-link-input{
  flex:1;height:38px;padding:0 12px;border:1px solid #eee;border-radius:10px;
  font-size:12px;color:#666;background:#f9f9f9;outline:none
}
.cx-link-input:focus{border-color:#FBAB18}
.cx-link-copy{
  height:38px;padding:0 16px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#F26E26,#FBAB18);color:#fff;
  font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap
}
.cx-link-copy:hover{opacity:.9}

/* Summary */
.cx-sum-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cx-sum-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(135deg,#F26E26,#FBAB18);color:#fff;
  font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px
}
.cx-sum-badge svg{width:12px;height:12px}
.cx-summary-list{margin:0;padding:0;list-style:none}
.cx-summary-list li{
  padding:10px 12px;font-size:13px;color:#333;border-radius:10px;
  transition:.15s;display:flex;align-items:center;gap:10px
}
.cx-summary-list li:hover{background:#f8f8f8}
.cx-summary-list li::before{
  content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#F26E26,#FBAB18)
}

.tts-active{background:#fff4ea!important;border-left:3px solid #F26E26;padding-left:12px!important;transition:.2s}

@media(max-width:480px){
  .cx-toolbar{left:12px;right:12px;bottom:12px;transform:none;width:auto;border-radius:16px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .cx-tb-voice{font-size:11px;padding:6px 8px}
  .cx-voice-panel{left:auto;right:0;transform:none;width:150px}
  .cx-modal{max-width:100%;border-radius:16px 16px 0 0;align-self:flex-end;margin-bottom:0}
  .cx-modal-overlay{align-items:flex-end;padding:0}
  .cx-share-grid{grid-template-columns:repeat(3,1fr)}
}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){

var contentRoot=document.getElementById('voice');
if(!contentRoot)return;
var voiceWidget=document.querySelector('[data-id="fb8087a"]');
if(!voiceWidget)return;

var VOICES=[
  {name:'Sonia',gender:'Female'},
  {name:'Jenny',gender:'Female'},
  {name:'Aria',gender:'Female'},
  {name:'David',gender:'Male'},
  {name:'Guy',gender:'Male'}
];
var SPEEDS=[0.75,1,1.25,1.5,1.75,2];
var selectedVoiceName='Sonia';
var rate=1;

/* Wait for voices to load before matching */
var voicesReady=false;
function loadVoices(){
  var v=speechSynthesis.getVoices();
  if(v.length>0)voicesReady=true;
}
loadVoices();
if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;

/* Build toolbar */
var toolbar=document.createElement('div');
toolbar.className='cx-toolbar';
toolbar.innerHTML='<div class="cx-toolbar-row">'+
  '<button class="cx-tb-btn primary" id="cxPlay" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>'+
  '<button class="cx-tb-btn" id="cxPause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg></button>'+
  '<button class="cx-tb-btn" id="cxStop" aria-label="Stop"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg></button>'+
  '<div class="cx-tb-divider"></div>'+
  '<div style="position:relative">'+
    '<button class="cx-tb-voice" id="cxVoiceTrigger"><span id="cxVoiceLabel">Sonia</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>'+
    '<div class="cx-voice-panel" id="cxVoicePanel"></div>'+
  '</div>'+
  '<div class="cx-tb-divider"></div>'+
  '<button class="cx-tb-speed" id="cxSpeedBtn">1x</button>'+
  '</div>'+
  '<div class="cx-progress-track"><div class="cx-progress-fill" id="cxProgressFill"></div></div>';
document.body.appendChild(toolbar);

var progressFill=toolbar.querySelector('#cxProgressFill');
var speedBtn=toolbar.querySelector('#cxSpeedBtn');
speedBtn.addEventListener('click',function(){
  var idx=SPEEDS.indexOf(rate);
  rate=SPEEDS[(idx+1)%SPEEDS.length];
  speedBtn.textContent=rate+'x';
  if(speaking&&!paused){speechSynthesis.cancel();speakNext()}
});

/* Voice panel */
var voicePanel=toolbar.querySelector('#cxVoicePanel');
voicePanel.innerHTML=VOICES.map(function(v){
  return '<div class="cx-voice-opt'+(v.name===selectedVoiceName?' selected':'')+'" data-voice="'+v.name+'">'+v.name+' <span style="opacity:.5;font-size:11px">'+v.gender+'</span></div>'
}).join('');

toolbar.querySelector('#cxVoiceTrigger').addEventListener('click',function(e){
  e.stopPropagation();voicePanel.classList.toggle('active')
});
voicePanel.querySelectorAll('.cx-voice-opt').forEach(function(opt){
  opt.addEventListener('click',function(){
    selectedVoiceName=this.dataset.voice;
    toolbar.querySelector('#cxVoiceLabel').textContent=selectedVoiceName;
    voicePanel.querySelectorAll('.cx-voice-opt').forEach(function(o){o.classList.remove('selected')});
    this.classList.add('selected');
    voicePanel.classList.remove('active');
  });
});

/* Toggle toolbar */
voiceWidget.addEventListener('click',function(e){e.stopPropagation();toolbar.classList.toggle('active')});
document.addEventListener('click',function(e){
  if(!toolbar.contains(e.target)&&!voiceWidget.contains(e.target)){
    toolbar.classList.remove('active');voicePanel.classList.remove('active')
  }
});

/* ===== FIX 1: Voice matching — use exact startswith + fallback chain ===== */
function getVoiceObj(){
  var all=speechSynthesis.getVoices();
  if(!all.length)return null;
  var target=selectedVoiceName.toLowerCase();
  /* Try exact match first */
  var found=all.find(function(v){return v.name.toLowerCase()===target});
  if(found)return found;
  /* Try "Microsoft NAME" or "NAME (Natural)" patterns */
  found=all.find(function(v){return v.name.toLowerCase().indexOf(target)!==-1});
  if(found)return found;
  /* Try language-based fallback */
  var langMatch=all.find(function(v){return v.lang.indexOf('en')!==-1});
  return langMatch||all[0];
}

/* ===== FIX 2: Build queue from RAW TEXT NODES — no skipping ===== */
var queue=[],ci=0,speaking=false,paused=false;

function buildQueue(){
  queue=[];
  var seen=new Set();
  function walk(node){
    if(node.nodeType===3){
      var t=node.textContent.trim();
      if(t.length>1){
        var parent=node.parentElement;
        if(parent&&!seen.has(parent)&&parent.offsetParent!==null){
          var tag=parent.tagName;
          if(tag!=='SCRIPT'&&tag!=='STYLE'&&tag!=='BUTTON'&&tag!=='NAV'){
            seen.add(parent);
            queue.push({element:parent,text:t});
          }
        }
      }
      return;
    }
    if(node.nodeType!==1)return;
    var skipTags={SCRIPT:1,STYLE:1,BUTTON:1,NAV:1,SELECT:1,INPUT:1};
    if(skipTags[node.tagName])return;
    for(var c=node.firstChild;c;c=c.nextSibling)walk(c);
  }
  walk(contentRoot);
}

function speakNext(){
  if(!speaking)return;
  if(ci>=queue.length){stop();return}
  var item=queue[ci];
  document.querySelectorAll('.tts-active').forEach(function(e){e.classList.remove('tts-active')});
  item.element.classList.add('tts-active');
  item.element.scrollIntoView({behavior:'smooth',block:'center'});
  progressFill.style.width=queue.length?((ci/queue.length)*100)+'%':'0%';

  var u=new SpeechSynthesisUtterance(item.text);
  var voice=getVoiceObj();
  if(voice)u.voice=voice;
  u.rate=rate;
  u.onerror=function(){ci++;speakNext()};
  u.onend=function(){ci++;speakNext()};
  speechSynthesis.speak(u);
}

function play(){
  speechSynthesis.cancel();
  buildQueue();
  if(!queue.length)return;
  ci=0;paused=false;speaking=true;
  voiceWidget.classList.add('is-playing');
  speakNext();
}
function pause(){if(speaking){speechSynthesis.pause();paused=true}}
function stop(){
  speechSynthesis.cancel();
  speaking=false;paused=false;ci=0;
  voiceWidget.classList.remove('is-playing');
  progressFill.style.width='0%';
  document.querySelectorAll('.tts-active').forEach(function(e){e.classList.remove('tts-active')});
}

toolbar.querySelector('#cxPlay').addEventListener('click',function(){
  if(paused){speechSynthesis.resume();paused=false}else{play()}
});
toolbar.querySelector('#cxPause').addEventListener('click',pause);
toolbar.querySelector('#cxStop').addEventListener('click',stop);

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){stop();toolbar.classList.remove('active')}
});

/* ===== MODAL ===== */
function openModal(html){
  var o=document.createElement('div');
  o.className='cx-modal-overlay';
  o.innerHTML='<div class="cx-modal">'+html+'</div>';
  document.body.appendChild(o);
  o.addEventListener('click',function(e){if(e.target===o)cl()});
  o.querySelector('.cx-modal-close').addEventListener('click',cl);
  function esc(e){if(e.key==='Escape')cl()}
  document.addEventListener('keydown',esc);
  function cl(){o.remove();document.removeEventListener('keydown',esc)}
  return o;
}

/* ===== SHARE — SaaS B2B style ===== */
var shareBtn=document.querySelector('.share');
if(shareBtn){
  shareBtn.addEventListener('click',function(){
    var url=window.location.href;
    var o=openModal(
      '<div class="cx-m-header"><div><h3 class="cx-m-title">Share</h3><p class="cx-m-sub">Spread the word</p></div><button class="cx-modal-close">&times;</button></div>'+
      '<div class="cx-m-body">'+
      '<div class="cx-share-grid">'+
        '<a class="cx-share-btn linkedin" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(url)+'">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>LinkedIn'+
        '</a>'+
        '<a class="cx-share-btn x" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url='+encodeURIComponent(url)+'">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-7.3 8.3L23.3 22h-6.8l-5.3-6.9L4.9 22H1.8l7.8-8.9L1 2h6.9l4.8 6.3L18.9 2zm-1.2 18h1.9L7.4 4H5.4l12.3 16z"/></svg>X'+
        '</a>'+
        '<a class="cx-share-btn whatsapp" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(url)+'">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.2-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4-.1-.1-.5-1.3-.7-1.8-.2-.5-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9 0 1.1.8 2.2.9 2.4.1.2 1.6 2.4 3.8 3.4.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>WhatsApp'+
        '</a>'+
        '<a class="cx-share-btn email" href="mailto:?subject=Check%20this%20out&body='+encodeURIComponent(url)+'">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>Email'+
        '</a>'+
        '<a class="cx-share-btn telegram" target="_blank" rel="noopener" href="https://t.me/share/url?url='+encodeURIComponent(url)+'">'+
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>Telegram'+
        '</a>'+
        '<a class="cx-share-btn copy-link" id="cxShareCopy" href="javascript:void(0)">'+
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Copy link'+
        '</a>'+
      '</div>'+
      '<div class="cx-divider-line"></div>'+
      '<div class="cx-link-box"><input type="text" readonly value="'+url+'" class="cx-link-input" id="cxLinkInput"><button class="cx-link-copy" id="cxLinkCopy">Copy</button></div>'+
      '</div>'
    );
    o.querySelector('#cxLinkCopy').addEventListener('click',function(){
      var inp=o.querySelector('#cxLinkInput');inp.select();var b=this;
      navigator.clipboard.writeText(inp.value).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1400)});
    });
    o.querySelector('#cxShareCopy').addEventListener('click',function(){
      var b=this;
      navigator.clipboard.writeText(url).then(function(){
        b.querySelector('svg').outerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
        b.childNodes[b.childNodes.length-1].textContent='Copied!';
        setTimeout(function(){b.querySelector('svg').outerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';b.childNodes[b.childNodes.length-1].textContent='Copy link'
      },1400);
    });
  });
}

/* ===== SUMMARY — SaaS B2B style ===== */
var summaryBtn=document.querySelector('.summary');
if(summaryBtn){
  summaryBtn.addEventListener('click',function(e){
    e.preventDefault();
    var provided=document.getElementById('page-summary');
    var items;
    if(provided){
      items=[].slice.call(provided.querySelectorAll('li,p')).map(function(el){return el.textContent.trim()}).filter(Boolean);
    }else{
      items=[].slice.call(contentRoot.querySelectorAll('h2')).map(function(h){return h.textContent.trim()});
    }
    var listHTML=items.map(function(t){return '<li>'+t+'</li>'}).join('');
    openModal(
      '<div class="cx-m-header"><div><h3 class="cx-m-title">Quick Summary</h3><p class="cx-m-sub">'+items.length+' key points</p></div><button class="cx-modal-close">&times;</button></div>'+
      '<div class="cx-m-body">'+
      '<div class="cx-sum-head"><span class="cx-sum-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h14"/></svg>'+items.length+' sections</span></div>'+
      '<ul class="cx-summary-list">'+listHTML+'</ul>'+
      '</div>'
    );
  });
}

});
</script>
