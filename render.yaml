# Render blueprint — Enterprise AI Agent backend + managed Postgres.
# Deploy: https://render.com -> New -> Blueprint -> connect this repo.
# After deploy, set the "sync: false" env vars (API keys, owner credentials)
# in the Render dashboard for the ai-agent-backend service, then Deploy again.
#
# ⚠️⚠️  LOUD WARNING — FREE TIER IS NOT PRODUCTION  ⚠️⚠️
# ---------------------------------------------------------------------------
# 1. Free web services spin down after ~15 min of inactivity. A customer's
#    first message after idle can take 30-60s (cold start). The frontend
#    health badge is real (live /v1/health polling), but a cold start is
#    still a cold start. The `ai-agent-keepalive` cron job below pings
#    /v1/health every 10 min to keep this instance warm. That is a BAND-AID,
#    not an SLA — Render may still recycle or spin down the instance.
# 2. Free Postgres databases are DELETED after 30 days. Data loss is
#    guaranteed if you keep ai-agent-db on the free plan.
# 3. BEFORE onboarding any real customer or running a demo that must not
#    embarrass you: bump the web service `plan` to `starter` (or higher) and
#    the database `plan` to `basic-256mb` (or higher), then redeploy. The
#    cost is roughly USD $7 + $7 per month for a real production baseline.
# ---------------------------------------------------------------------------
databases:
  - name: ai-agent-db
    plan: free            # ⚠️ free Postgres is DELETED after 30 days
    databaseName: agentai
    user: agentai
    region: oregon
  - name: ai-agent-db-staging
    plan: free            # Staging Postgres - separate from production
    databaseName: agentai_staging
    user: agentai_staging
    region: oregon

services:
  # --- Production ---
  - type: web
    name: ai-agent-backend
    runtime: docker
    plan: free            # ⚠️ free spins down after ~15 min idle
    region: oregon
    rootDir: agent-ai/enterprise-ai-agent
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-agent-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://jeevithkumarjt.github.io"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: ANTHROPIC_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ANTHROPIC_MODEL
        value: llama-3.3-70b-versatile
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDINGS_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDINGS_MODEL
        value: text-embedding-3-small
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: AGENT_MAX_TOOL_ITERATIONS
        value: "5"
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: BOOTSTRAP_OWNER_PASSWORD
        sync: false

  # Keep-alive: pings /v1/health every 10 min so the free web service stays
  # warm. PING_URL below matches the deployed backend (api-config.js); update
  # it if the service URL changes. This is a stop-gap for demos — see the
  # warning at the top of this file.
  - type: cron
    name: ai-agent-keepalive
    runtime: docker
    plan: free
    region: oregon
    rootDir: agent-ai/enterprise-ai-agent
    dockerfilePath: keepalive/Dockerfile
    schedule: "*/10 * * * *"
    envVars:
      - key: PING_URL
        value: https://ai-agent-backend-wnc6.onrender.com

  # --- Staging (separate DB + separate service) ---
  - type: web
    name: ai-agent-backend-staging
    runtime: docker
    plan: free            # Staging on free tier to start; bump to starter for real use
    region: oregon
    rootDir: agent-ai/enterprise-ai-agent
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-agent-db-staging
          property: connectionString
      - key: APP_ENV
        value: staging
      - key: DEBUG
        value: "true"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: ANTHROPIC_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ANTHROPIC_MODEL
        value: llama-3.3-70b-versatile
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: EMBEDDINGS_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDINGS_MODEL
        value: text-embedding-3-small
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: AGENT_MAX_TOOL_ITERATIONS
        value: "5"
      - key: BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: BOOTSTRAP_OWNER_PASSWORD
        sync: false

  # Staging keep-alive: same pattern as production keepalive
  - type: cron
    name: ai-agent-keepalive-staging
    runtime: docker
    plan: free
    region: oregon
    rootDir: agent-ai/enterprise-ai-agent
    dockerfilePath: keepalive/Dockerfile
    schedule: "*/10 * * * *"
    envVars:
      - key: PING_URL
        value: https://ai-agent-backend-staging-render-url.onrender.com
