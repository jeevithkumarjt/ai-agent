[project]
name = "agentai-api"
version = "1.0.0"
description = "AgentAI — Enterprise AI Knowledge Platform API"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "qdrant-client>=1.9",
    "celery>=5.4",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "lxml>=5.2",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "sentry-sdk[fastapi]>=2.1",
    "fastembed>=0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "tiktoken>=0.7",
    "orjson>=3.10",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.28"]
google = ["google-genai>=1.0"]
azure = ["openai>=1.30"]
mistral = ["mistralai>=0.4"]
groq = ["openai>=1.30"]
ocr = ["pytesseract>=0.3", "Pillow>=10.3"]
pii = ["presidio-analyzer>=2.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.4",
    "httpx>=0.27",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: integration tests requiring docker stack", "eval: golden dataset regression gate"]

[tool.coverage.run]
source = ["src"]
omit = ["src/interfaces/api/routes_*.py", "src/workers/*"]
