<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TryMe Enterprise AI — Admin Portal</title>
<script src="api-config.js"></script>
<style>
:root{
  --primary:#294199; --primary-2:#1E3378; --primary-3:#3B5BDB;
  --accent:#C8501B; --accent-2:#A63F0E; --on-accent:#FFFFFF;
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9;
  --text:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --green:#15803D; --green-bg:#DCFCE7; --red:#B91C1C; --red-bg:#FEE2E2;
  --amber:#92400E; --amber-bg:#FEF3C7; --blue:#1D4ED8; --blue-bg:#DBEAFE;
  --violet:#6D28D9; --violet-bg:#EDE9FE;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --radius:14px; --ease:cubic-bezier(.22,1,.36,1); font-size:15px;
}
html[data-theme="dark"]{
  --bg:#0B1120; --surface:#131C31; --surface-2:#1B2740;
  --text:#E6EDF7; --muted:#94A3B8; --line:#24324E;
  --accent:#FF8C42; --accent-2:#FFA066; --on-accent:#0F172A;
  --green:#4ADE80; --green-bg:#14532D; --red:#F87171; --red-bg:#450A0A;
  --amber:#FBBF24; --amber-bg:#452A0A; --blue:#60A5FA; --blue-bg:#1E3A8A;
  --violet:#A78BFA; --violet-bg:#3B0764;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .3s var(--ease),color .3s var(--ease)}
a{color:var(--primary-3)}
button{font-family:inherit}
input,select,textarea{font-family:inherit;font-size:.92rem;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:.55rem .7rem;outline:none;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary-3);box-shadow:0 0 0 3px rgba(59,91,219,.15)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;letter-spacing:.02em}
#app{display:none;min-height:100vh}
#app.auth-open{display:flex}
.sidebar{width:238px;flex:none;background:linear-gradient(180deg,var(--primary-2),#16244f 60%);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:.65rem;padding:1.15rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary-3),var(--accent));display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none}
.brand .t{font-weight:700;font-size:.98rem;line-height:1.15}
.brand .s{font-size:.7rem;opacity:.6;letter-spacing:.05em}
.nav{flex:1;overflow-y:auto;padding:.7rem .6rem;display:flex;flex-direction:column;gap:.1rem}
.nav .group{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.38);padding:.65rem .7rem .25rem}
.nav a{display:flex;align-items:center;gap:.7rem;padding:.55rem .75rem;border-radius:9px;color:rgba(255,255,255,.78);text-decoration:none;font-size:.88rem;font-weight:500;transition:all .18s var(--ease)}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav a .ic{opacity:.85;flex:none}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--on-accent);font-size:.65rem;font-weight:700;border-radius:20px;padding:.1rem .45rem}
.side-foot{padding:.8rem 1rem;border-top:1px solid rgba(255,255,255,.09);font-size:.72rem;color:rgba(255,255,255,.45);display:flex;align-items:center;gap:.4rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:1rem;padding:0 1.4rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar h1{font-size:1.06rem;font-weight:700}
.topbar .sub{font-size:.74rem;color:var(--muted)}
.spacer{flex:1}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;display:grid;place-items:center;position:relative;transition:background .2s;font-size:.95rem}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.user-chip{display:flex;align-items:center;gap:.6rem;padding:.35rem .5rem .35rem .35rem;border-radius:30px;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.user-chip .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary-3),var(--violet));color:#fff;display:grid;place-items:center;font-weight:700;font-size:.75rem}
.user-chip .u{font-size:.8rem;font-weight:600;line-height:1.05}
.user-chip .r{font-size:.68rem;color:var(--muted)}
.content{padding:1.4rem;max-width:1240px;width:100%;margin:0 auto}
.page{display:none;animation:fadeIn .28s var(--ease)}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.15rem 1.25rem;margin-bottom:1rem}
.card h3{font-size:.92rem;font-weight:700;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.card h3 .hint{font-size:.72rem;color:var(--muted);font-weight:500}
.grid{display:grid;gap:1rem}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-3{grid-template-columns:repeat(2,1fr)}.grid.cols-2{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:1rem 1.15rem;position:relative;overflow:hidden}
.stat .lbl{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat .val{font-size:1.7rem;font-weight:800;margin-top:.3rem;letter-spacing:-.02em}
.stat .sub{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.stat .ic{position:absolute;right:.9rem;top:.9rem;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;opacity:.9}
.stat-link{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s var(--ease),border-color .15s var(--ease)}
.stat-link:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:0 10px 24px rgba(15,23,42,.14);z-index:1}
.act-item{display:flex;gap:.7rem;padding:.7rem .2rem;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;align-items:flex-start;transition:background .12s}
.act-item:hover{background:var(--surface-2)}
.act-item:last-child{border-bottom:none}
.act-item .nd{width:9px;height:9px;border-radius:50%;margin-top:.35rem;flex:none}
.act-item .title{font-size:.84rem;font-weight:600}
.act-item .msg{font-size:.76rem;color:var(--muted);margin-top:.1rem;word-break:break-word}
.act-item .when{font-size:.7rem;color:var(--muted);margin-top:.15rem;white-space:nowrap}
.link{display:inline-block;font-size:.78rem;color:var(--primary);text-decoration:none;margin-top:.4rem;font-weight:600}
.link:hover{text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;border-radius:20px;padding:.18rem .55rem}
.b-green{background:var(--green-bg);color:var(--green)}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-blue{background:var(--blue-bg);color:var(--blue)}
.b-violet{background:var(--violet-bg);color:var(--violet)}
.b-gray{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.45rem;border:none;border-radius:9px;padding:.55rem .95rem;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .18s var(--ease)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-2);transform:translateY(-1px)}
.btn-a{background:var(--accent);color:var(--on-accent)}
.btn-a:hover{background:var(--accent-2)}
.btn-o{background:var(--surface);color:var(--text);border:1px solid var(--line)}
.btn-o:hover{background:var(--surface-2)}
.btn-d{background:var(--red-bg);color:var(--red)}
.btn-d:hover{filter:brightness(.96)}
.btn-g{background:var(--green-bg);color:var(--green)}
.btn-sm{padding:.32rem .6rem;font-size:.75rem;border-radius:7px}
.tbl-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:.84rem;background:var(--surface)}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:.7rem .9rem;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:700;white-space:nowrap}
.tbl td{padding:.68rem .9rem;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:.74rem}
.toolbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input[type=text]{width:240px}
.empty{padding:2.4rem;text-align:center;color:var(--muted);font-size:.85rem}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--primary-3);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{height:8px;background:var(--surface-2);border-radius:20px;overflow:hidden;flex:1}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary-3),var(--accent));border-radius:20px;transition:width .4s var(--ease)}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,13,28,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:6vh 1rem;z-index:100;animation:fadeIn .2s}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.25);width:100%;max-width:560px;max-height:88vh;overflow:auto;animation:pop .25s var(--ease)}
.modal.wide{max-width:760px}
@keyframes pop{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:.6rem;padding:1.05rem 1.3rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h2{font-size:1rem;font-weight:700;flex:1}
.modal-body{padding:1.2rem 1.3rem}
.modal-foot{padding:1rem 1.3rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.6rem;position:sticky;bottom:0;background:var(--surface)}
.modal .field{margin-bottom:.95rem}
pre.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:.8rem;font-size:.78rem;white-space:pre-wrap;max-height:280px;overflow:auto;font-family:inherit}
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:.5rem;z-index:200}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary-3);border-radius:10px;box-shadow:var(--shadow);padding:.75rem 1rem;min-width:260px;max-width:380px;animation:slideIn .3s var(--ease);font-size:.84rem}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.warning{border-left-color:var(--amber)}
.toast .t{font-weight:700;margin-bottom:.15rem}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dropzone{border:2px dashed var(--line);border-radius:var(--radius);padding:2.4rem 1rem;text-align:center;color:var(--muted);cursor:pointer;transition:all .2s;background:var(--surface)}
.dropzone:hover,.dropzone.drag{border-color:var(--primary-3);background:var(--blue-bg);color:var(--primary-3)}
.dropzone .big{font-size:1.6rem;margin-bottom:.4rem}
#login{display:none;min-height:100vh;place-items:center;background:linear-gradient(135deg,#16244f 0%,var(--primary-3) 55%,var(--accent) 120%);padding:1rem}
#login.open{display:grid}
.login-card{background:var(--surface);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);width:100%;max-width:420px;padding:2.2rem;animation:pop .4s var(--ease)}
.login-card .logo{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,var(--primary-3),var(--accent));display:grid;place-items:center;font-size:1.5rem;font-weight:800;color:#fff;margin-bottom:1.1rem}
.login-card h1{font-size:1.35rem;font-weight:800;margin-bottom:.25rem}
.login-card p{font-size:.85rem;color:var(--muted);margin-bottom:1.4rem}
.login-card .btn{width:100%;justify-content:center;padding:.7rem;font-size:.9rem}
.login-card .field{margin-bottom:1rem}
.login-error{color:var(--red);font-size:.8rem;margin-top:.7rem;min-height:1em}
.chart-legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:.6rem}
.chart-legend .k{display:inline-flex;align-items:center;gap:.35rem}
.chart-legend .sw{width:10px;height:10px;border-radius:3px}
.funnel{display:flex;flex-direction:column;gap:.55rem;align-items:center}
.funnel .node{width:min(420px,90%);text-align:center;padding:.7rem .9rem;border-radius:11px;font-weight:700;font-size:.84rem;position:relative;box-shadow:var(--shadow);animation:grow .5s var(--ease) both;color:#fff}
.funnel .node small{display:block;font-weight:500;font-size:.74rem;opacity:.75}
.funnel .node .pct{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);font-size:.7rem;font-weight:800;opacity:.8}
.funnel .arrow{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-top:10px solid var(--muted);opacity:.5}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
.bar-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;font-size:.78rem}
.bar-row .lbl{width:150px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:600}
.bar-row .track{flex:1;height:16px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--primary-3),var(--primary));border-radius:8px;min-width:2px;transition:width .6s var(--ease)}
.bar-row .val{width:44px;flex:none;text-align:right;font-weight:700;font-size:.78rem}
svg text{user-select:none}
.empty-chart{padding:2rem;text-align:center;color:var(--muted);font-size:.8rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:.2rem;gap:.15rem}
.seg button{border:none;background:transparent;color:var(--muted);padding:.35rem .7rem;border-radius:7px;font-size:.78rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.45rem 0;font-size:.84rem;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right;word-break:break-all}
.health-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:.4rem}
.hok{background:var(--green)}.hbad{background:var(--red)}
.notif-item{display:flex;gap:.7rem;padding:.75rem .2rem;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.notif-item:last-child{border-bottom:none}
.notif-item .nd{width:9px;height:9px;border-radius:50%;margin-top:.35rem;flex:none}
.notif-item.unread .title{font-weight:700}
.notif-item .title{font-size:.86rem}
.notif-item .msg{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.notif-item .when{font-size:.7rem;color:var(--muted);margin-top:.15rem}
.ver-item{border:1px solid var(--line);border-radius:10px;padding:.8rem;margin-bottom:.6rem;background:var(--surface)}
.ver-item .vh{display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem}
.version-chip{font-size:.68rem;font-weight:700;background:var(--primary-3);color:#fff;border-radius:6px;padding:.12rem .4rem}
.drawer-backdrop{position:fixed;inset:0;background:rgba(8,13,28,.5);display:none;z-index:90}
.drawer-backdrop.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .3s var(--ease);display:flex;flex-direction:column;z-index:95}
.drawer.open{transform:none}
.drawer-head{padding:1.1rem 1.3rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem}
.drawer-head h3{font-size:1rem;flex:1}
.drawer-body{flex:1;overflow:auto;padding:1.1rem 1.3rem}
.msg-bubble{margin-bottom:.9rem}
.msg-bubble .who{font-size:.68rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem}
.msg-bubble .bub{background:var(--surface-2);border-radius:11px;padding:.6rem .8rem;font-size:.82rem;white-space:pre-wrap}
.msg-bubble.user .bub{background:var(--blue-bg);color:var(--text)}
.msg-bubble.assistant .bub{background:var(--surface);border:1px solid var(--line)}
.kbd{font-size:.72rem;color:var(--muted)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--primary-3);outline-offset:2px}
.crumb{display:flex;align-items:center;gap:.45rem;font-size:.74rem;color:var(--muted);line-height:1.2;min-height:1.2em}
.crumb .sep{opacity:.55}
.crumb .cur{color:var(--text);font-weight:700}
.tenant-chip{display:inline-flex;align-items:center;gap:.4rem;height:34px;padding:0 .8rem 0 .65rem;border:1px solid var(--line);border-radius:20px;font-size:.76rem;font-weight:600;color:var(--text);background:var(--surface);white-space:nowrap;max-width:200px}
.tenant-chip .td{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.tenant-chip .tn{overflow:hidden;text-overflow:ellipsis}
.help-sec{margin-bottom:1.05rem}
.help-sec h4{font-size:.8rem;font-weight:700;margin-bottom:.35rem;color:var(--primary-3)}
.help-sec p{font-size:.8rem;color:var(--muted);margin-bottom:.3rem;line-height:1.55}
.sk{position:relative;overflow:hidden;background:var(--surface-2);border-radius:8px;display:inline-block}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:sk-shine 1.15s ease-in-out infinite}
html[data-theme="dark"] .sk::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
@keyframes sk-shine{to{transform:translateX(100%)}}
.sk-chart{height:190px;width:100%;margin-top:.8rem}
.sk-rows>div{padding:.7rem .2rem;border-bottom:1px solid var(--line)}
.sk-rows>div:last-child{border-bottom:none}
@media(max-width:860px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:80;transform:translateX(-105%);transition:transform .3s var(--ease)}.sidebar.mobile-open{transform:none}#menu-btn{display:grid!important}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="logo">TryMe</div>
    <h1>Admin Portal</h1>
    <p>Enterprise AI Knowledge &amp; Operations Console</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="username" placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" required autocomplete="current-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"></div>
      <button class="btn btn-p" type="submit" id="login-btn"><span>Sign in</span></button>
      <div class="login-error" id="login-error" role="alert"></div>
    </form>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">TryMe</div>
      <div><div class="t">TryMe AI Admin</div><div class="s">Enterprise Console</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span class="spin" style="width:10px;height:10px"></span> <span id="health-foot">checking&hellip;</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" title="Menu" aria-label="Open menu">&#9776;</button>

const $=(s,el)=>el?el.querySelector(s):document.querySelector(s);
const $$=(s,el)=>(el?el:document).querySelectorAll(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes=n=>n>1048576?(n/1048576).toFixed(1)+" MB":n>1024?(n/1024).toFixed(1)+" KB":n+" B";
const fmtNum=n=>(n??0).toLocaleString();
const qa=(s,el)=>Array.from($$(s,el));
function fmtTime(s){ if(!s)return "&mdash;"; const d=new Date(s.replace(" ","T")+"Z"); if(isNaN(d))return s; const p=x=>String(x).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
const t={};

/* ---- auth ---- */
const store={get:k=>localStorage.getItem(k),set:(k,v)=>localStorage.setItem(k,v),del:k=>localStorage.removeItem(k)};
let me=null;
async function refreshToken(){ const rt=store.get("rt"); if(!rt)throw new Error("no refresh"); const res=await fetch(AUTH+"/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:rt})}); if(!res.ok)throw new Error("refresh failed"); const d=await res.json(); store.set("at",d.access_token); return d.access_token; }
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({Authorization:"Bearer "+store.get("at")},opts.headers||{});
  if(opts.body&&!(opts.body instanceof FormData)&&!headers["Content-Type"])headers["Content-Type"]="application/json";
  let res=await fetch(API+path,Object.assign({},opts,{headers}));
  if(res.status===401&&!opts._retry){
    try{ const at=await refreshToken(); headers.Authorization="Bearer "+at; res=await fetch(API+path,Object.assign({},opts,{headers,_retry:true})); }
    catch(e){ logout(); throw new Error("Session expired"); }
  }
  if(res.status===401){ logout(); throw new Error("Session expired"); }
  if(res.status===403){ const d=await res.json().catch(()=>({})); throw new Error(d.detail||"forbidden"); }
  if(!res.ok){ const d=await res.json().catch(()=>({})); throw new Error(d.detail||res.statusText); }
  if(res.status===204)return null;
  const ct=res.headers.get("content-type")||"";
  return ct.includes("json")?res.json():res;
}
function logout(){ store.del("at"); store.del("rt"); me=null; location.hash=""; $("#app").classList.remove("auth-open"); $("#login").classList.add("open"); }
async function login(email,password){
  const res=await fetch(AUTH+"/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password})});
  if(!res.ok){ const d=await res.json().catch(()=>({})); throw new Error(d.detail||"invalid credentials"); }
  const d=await res.json(); store.set("at",d.access_token); store.set("rt",d.refresh_token);
  me=await api("/me");
  $("#app").classList.add("auth-open"); $("#login").classList.remove("open"); boot();
}
$("#login-form").addEventListener("submit",async e=>{
  e.preventDefault(); const btn=$("#login-btn"); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Signing in&hellip;'; $("#login-error").textContent="";
  try{ await login($("#login-email").value,$("#login-pass").value); }
  catch(err){ $("#login-error").textContent=err.message; }
  finally{ btn.disabled=false; btn.innerHTML="Sign in"; }
});

/* ---- charts ---- */
function svgLineChart(el,series){
  const W=680,H=220,P=34,B=26,gw=W-P-10,gh=H-P-14;
  const allY=[].concat.apply([],series.map(s=>s.points.map(p=>p.y)));
  if(!allY.length){ el.innerHTML='<div class="empty-chart">No data yet</div>'; return; }
  const maxY=Math.max.apply(null,allY.concat([1]));
  const xs=series[0].points.map(p=>p.x);
  const xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs),xr=(xmax-xmin)||1;
  const X=x=>(x-xmin)/xr*gw+P;
  const Y=y=>H-B-(y/maxY)*gh;
  let svg='<svg viewBox="0 0 '+W+" "+H+'" width="100%" style="max-height:240px">';
  for(let i=0;i<=4;i++){ const y=Y(maxY*i/4); svg+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-10)+'" y2="'+y+'" stroke="var(--line)" stroke-dasharray="3 4"/>'; svg+='<text x="'+(P-6)+'" y="'+(y+3)+'" text-anchor="end" font-size="9" fill="var(--muted)">'+Math.round(maxY*i/4)+"</text>"; }
  const n=xs.length,step=n>1?Math.max(1,Math.floor(n/7)):1;
  xs.forEach((x,i)=>{ if(i%step===0||i===n-1)svg+='<text x="'+X(x)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="var(--muted)">'+x+"</text>"; });
  series.forEach(s=>{
    let line=s.points.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ");
    const last=s.points[s.points.length-1];
    svg+='<path d="'+line+" L"+X(last.x).toFixed(1)+","+(H-B)+" L"+X(s.points[0].x).toFixed(1)+","+(H-B)+' Z" fill="'+s.color+'" opacity=".12"/>';
    svg+='<path d="'+line+'" fill="none" stroke="'+s.color+'" stroke-width="2.4" stroke-linecap="round"/>';
    if(n<=30)s.points.forEach(p=>{ svg+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.6" fill="'+s.color+'"/>'; });
  });
  svg+="</svg>";
  el.innerHTML=svg;
}
function svgDonut(el,data,colors){
  const total=data.reduce((a,b)=>a+b.value,0);
  if(!total){ el.innerHTML='<div class="empty-chart">No data yet</div>'; return; }
  const C=66,r=38; let angle=-Math.PI/2,seg="";
  data.forEach((d,i)=>{
    const frac=d.value/total,end=angle+frac*2*Math.PI;
    const x1=C+r*Math.cos(angle),y1=C+r*Math.sin(angle),x2=C+r*Math.cos(end),y2=C+r*Math.sin(end);
    seg+='<path d="M'+x1.toFixed(1)+","+y1.toFixed(1)+" A"+r+","+r+" 0 "+(frac>0.5?1:0)+" 1 "+x2.toFixed(1)+","+y2.toFixed(1)+'" fill="none" stroke="'+(colors[i]||"#888")+'" stroke-width="24"/>';
    angle=end;
  });
  el.innerHTML='<div style="display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap"><svg viewBox="0 0 132 132" width="150" style="flex:none">'+seg+'<text x="66" y="62" text-anchor="middle" font-size="19" font-weight="800" fill="var(--text)">'+total+'</text><text x="66" y="80" text-anchor="middle" font-size="9" fill="var(--muted)">TOTAL</text></svg><div class="chart-legend" style="flex-direction:column;gap:.45rem">'+data.map((d,i)=>'<span class="k"><span class="sw" style="background:'+colors[i]+'"></span>'+esc(d.name)+' &mdash; <b>'+d.value+"</b></span>").join("")+"</div></div>";
}
function svgBars(el,items,color){
  if(!items.length){ el.innerHTML='<div class="empty-chart">No data yet</div>'; return; }
  const max=Math.max.apply(null,items.map(i=>i.value).concat([1]));
  el.innerHTML=items.map(i=>'<div class="bar-row"><span class="lbl" title="'+esc(i.name)+'">'+esc(i.name)+'</span><div class="track"><div class="fill" style="width:'+(i.value/max*100).toFixed(1)+'%;background:'+color+'"></div></div><span class="val">'+fmtNum(i.value)+"</span></div>").join("");
}

const render={};

const S={days:14,anSeg:"trends",uqStatus:"",uqQ:"",docQ:"",docStatus:"",convQ:"",auditAction:"",tracked:null,timers:[],ovPoll:0};
function clearTimers(){ S.timers.forEach(clearInterval); S.timers=[]; }
function every(ms,fn){ S.timers.push(setInterval(fn,ms)); }
function fmtTime(s){
  if(!s)return "&mdash;";
  let d;
  if(typeof s==="number"||/^\d+(\.\d+)?$/.test(String(s).trim())){
    d=new Date(Number(s)*1000);
    if(isNaN(d))return s;
  }else{
    let t=String(s).replace(" ","T");
    t=t.replace(/\.\d+Z?$/,"").replace(/([+-]\d\d):(\d\d)Z$/,"$1:$2");
    const hasTz=/(Z|[+-]\d\d:\d\d)$/.test(t);
    if(!hasTz)t+="Z";
    d=new Date(t);
    if(isNaN(d))return s;
  }
  const p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function setPage(id,html){ $("#content").innerHTML='<section class="page'+(currentPage===id?" active":"")+'" id="page-'+id+'">'+html+"</section>"; }
function contentError(e){ console.error(e); if(e&&e.message)toast("Error","error",e.message); }
function definePage(id,fn){
  render[id]=async ()=>{
    currentPage=(location.hash.replace(/^#\/?/,"")||"overview").split("?")[0];
    $("#content").innerHTML='<div class="page'+(currentPage===id?" active":"")+'" id="page-'+id+'">'+pageSkeleton(id)+"</div>";
    try{ await fn(); }catch(e){ contentError(e); }
  };
}
function stat(lbl,val,sub,ic,bg,key,page){
  const inner='<div class="ic" style="background:'+bg+'">'+ic+'</div><div class="lbl">'+esc(lbl)+'</div><div class="val">'+val+'</div><div class="sub">'+esc(sub||"")+"</div>";
  return page?'<a class="stat stat-link" data-stat="'+(key||"")+'" data-goto="'+page+'" href="#/'+page+'">'+inner+"</a>":'<div class="stat" data-stat="'+(key||"")+'">'+inner+"</div>";
}
function kindBadge(k){ const m={upload:["Upload","b-blue"],retrain:["Retrain","b-violet"],sync:["Sync","b-amber"],rollback:["Rollback","b-gray"]}; const b=m[k]||[k,"b-gray"]; return '<span class="badge '+b[1]+'">'+b[0]+"</span>"; }

/* ---- skeleton loaders (match eventual layout) ---- */
function skLine(w,h,m){ return '<span class="sk" style="width:'+w+';height:'+(h||"12px")+(m?";margin-top:"+m:"")+'"></span>'; }
function skelStats(n,cols){ let s='<div class="grid cols-'+(cols||4)+'">'; for(let i=0;i<n;i++)s+='<div class="stat">'+skLine("62%","11px")+skLine("58%","24px",".55rem")+skLine("46%","10px",".5rem")+"</div>"; return s+"</div>"; }
function skelTable(rows,cols){ let h='<div class="tbl-wrap"><table class="tbl"><thead><tr>'; for(let c=0;c<cols;c++)h+='<th>'+skLine("64%","10px")+"</th>"; h+='</tr></thead><tbody>'; for(let r=0;r<rows;r++){ h+="<tr>"; for(let c=0;c<cols;c++)h+='<td>'+skLine((42+(r*7+c*13)%40)+"%","12px")+"</td>"; h+="</tr>"; } return h+"</tbody></table></div>"; }
function skelCards(n,chart){ let s=""; for(let i=0;i<n;i++)s+='<div class="card"><h3>'+skLine("38%","12px")+"</h3>"+(chart?'<div class="sk sk-chart"></div>':skLine("100%","12px")+'<div style="margin-top:.55rem">'+skLine("82%","12px")+"</div>")+"</div>"; return s; }
function skelList(n){ let s='<div class="sk-rows">'; for(let i=0;i<n;i++)s+='<div>'+skLine("55%","12px")+'<div style="margin-top:.4rem">'+skLine("88%","10px")+"</div></div>"; return s+"</div>"; }
function pageSkeleton(id){
  switch(id){
    case "overview": return skelStats(4)+'<div class="grid cols-2">'+skelCards(2,true)+"</div>";
    case "analytics": return skelStats(4)+skelCards(3,true);
    case "conversations": case "unanswered": case "knowledge": case "audit": case "jobs": return skelTable(8,6);
    case "upload": return '<div class="grid cols-2">'+skelCards(2,false)+"</div>"+skelCards(1,false);
    case "users": return skelTable(6,5)+skelList(3);
    case "settings": return '<div class="grid cols-2">'+skelCards(2,false)+"</div>"+skelCards(1,false);
    case "backup": return skelCards(3,false);
    case "health": return skelStats(3,3)+skelCards(1,false);
    default: return '<div class="card"><h3>'+skLine("38%","12px")+"</h3>"+skelTable(6,4)+"</div>";
  }
}

async function refreshKnowledgeStatus(){
  const lbl=$("#ov-kb-label"), dot=$("#ov-kb-dot"); if(!lbl)return;
  try{

    const n=(st&&st.source_count)||0, c=(st&&st.chunk_count)||0, err=(st&&st.last_error)||null;

  }catch(e){ dot.className="health-dot hbad"; lbl.style.color="var(--muted)"; lbl.textContent="Knowledge status unavailable"; }
}

async function refreshOverview(){
  const page=(location.hash.replace(/^#\/?/,"")||"overview").split("?")[0];
  if(page!=="overview")return;
  try{
    const [ov,tr]=await Promise.all([api("/overview"),api("/analytics/trends?days=7").catch(()=>({days:[]}))]);
    const set=(k,v,s)=>{ const el=$('[data-stat="'+k+'"]'); if(!el)return; const vv=el.querySelector(".val"); if(vv)vv.textContent=v; const ss=el.querySelector(".sub"); if(ss)ss.textContent=s; };
    const rt=ov.avg_response_time_ms>=1000?(ov.avg_response_time_ms/1000).toFixed(1)+"s":ov.avg_response_time_ms+"ms";
    set("conv",fmtNum(ov.conversations),"Today: "+fmtNum(ov.today_conversations));
    set("msg",fmtNum(ov.messages),fmtNum(ov.assistant_messages)+" assistant replies");
    set("docs",fmtNum(ov.documents),"managed documents");
    set("uq",fmtNum(ov.unanswered_total),fmtNum(ov.unanswered_new)+" awaiting review");
    set("rt",rt,"measured response time");
    set("ar",(ov.answered_percent||0)+"%","questions answered");
    set("sat",(ov.satisfaction||0).toFixed(1)+" / 5","avg user rating");
    set("tc",fmtNum(ov.tool_calls),"agent tool invocations");
    const ch=$("#ov-chart");
    if(ch&&(tr.days||[]).length)svgLineChart(ch,[
      {name:"Conversations",color:"#294199",points:tr.days.map(x=>({x:x.date.slice(5),y:x.conversations}))},
      {name:"Messages",color:"#F26E26",points:tr.days.map(x=>({x:x.date.slice(5),y:x.messages}))}
    ]);
    if(can("audit.view")){
      const act=await api("/audit?limit=8").catch(()=>({items:[]}));
      const feed=$("#ov-activity");
      if(feed)feed.innerHTML=(act.items||[]).map(actItemHtml).join("")||'<div class="empty">No activity yet</div>';
    }
    refreshKnowledgeStatus();
  }catch(e){}
}

    drop.addEventListener("drop",e=>{ e.preventDefault(); drop.classList.remove("drag"); if(e.dataTransfer.files.length)doUpload(e.dataTransfer.files); });
    fi.addEventListener("change",()=>{ if(fi.files.length)doUpload(fi.files); fi.value=""; });
  }
  const rt=$("#btn-retrain"); if(rt)rt.addEventListener("click",()=>runJob("retrain"));
  const sy=$("#btn-sync"); if(sy)sy.addEventListener("click",()=>runJob("sync"));

async function doUpload(files){
  const fd=new FormData(); Array.prototype.forEach.call(files,f=>fd.append("files",f));
  const drop=$("#drop"); if(drop)drop.innerHTML='<div class="big">&#128227;</div><div><b>Uploading&hellip;</b></div>';
  try{
    const r=await api("/knowledge/upload",{method:"POST",body:fd});
    if(drop)drop.innerHTML='<div class="big">&#9989;</div><div><b>Upload started</b></div>';
    const msg=[];
    if(r.created)msg.push(r.created+" document(s) queued");
    if(r.duplicates)msg.push(r.duplicates+" duplicate(s) skipped");
    if(r.errors&&r.errors.length)msg.push(r.errors.join(", "));
    toast("Upload","success",msg.join(" — ")||"Nothing to upload");
    if(r.job_id){ S.tracked=r.job_id; pollTracked(true); }
    route();
  }catch(e){
    if(drop)drop.innerHTML='<div class="big">&#128218;</div><div><b>Drag &amp; drop</b> files or click to browse</div>';
    toast("Upload failed","error",e.message);
  }
}
function trackJob(jobId){ S.tracked=jobId; pollTracked(true); }
async function pollTracked(force){
  const box=$("#up-progress"); if(!box||!S.tracked)return;
  try{
    const d=await api("/jobs"); const job=(d.items||[]).find(j=>j.id===S.tracked);
    if(!job)return;
    box.style.display="block";
    $("#up-bar").style.width=job.progress+"%"; $("#up-pct").textContent=job.progress+"%";
    $("#up-msg").textContent=job.message||"";
    if(job.status==="done"||job.status==="error"){ if(!force)setTimeout(()=>{ box.style.display="none"; },8000); }
  }catch(e){}
}
function runJob(kind){
  const btn=document.getElementById("btn-"+(kind==="retrain"?"retrain":"sync"));
  if(btn){ btn.disabled=true; btn.innerHTML='<span class="spin"></span> Starting&hellip;'; }
  api(kind==="retrain"?"/knowledge/retrain":"/knowledge/sync",{method:"POST"}).then(r=>{
    toast(kind==="retrain"?"Retraining started":"Site sync started","success");
    if(r.job_id)trackJob(r.job_id);
  }).catch(e=>toast("Failed","error",e.message)).finally(()=>{ if(btn){ btn.disabled=false; btn.innerHTML="&#128260; "+(kind==="retrain"?"Re-train index":"Sync sites"); } });
}

async function downloadFile(path,filename){
  let headers={Authorization:"Bearer "+store.get("at")};
  let res=await fetch(API+path,{headers});
  if(res.status===401){ try{ const at=await refreshToken(); headers.Authorization="Bearer "+at; res=await fetch(API+path,{headers}); }catch(e){ logout(); return; } }
  if(!res.ok){ let msg=res.statusText; try{ const d=await res.json(); msg=d.detail||msg; }catch(e){} toast("Download failed","error",msg); return; }
  const blob=await res.blob();
  download(filename,blob);
  toast("Export ready","success",filename);
}

  setPage("jobs",html);
});

/* ---- notifications & polling ---- */
function renderNotifDot(unread){ const dot=$("#notif-dot"); if(dot)dot.style.display=(unread>0)?"block":"none"; }
async function pollNotifs(){
  if(!can("notifications.view"))return;
  try{ const d=await api("/notifications"); S.notif=d; renderNotifDot(d.unread||0); }catch(e){}
}
async function pollJobs(){
  try{
    const d=await api("/jobs"); S.jobs=d;
    const running=(d.items||[]).filter(j=>j.status==="running").length;
    const badge=$("#nav-jobs-badge");
    if(badge){ badge.style.display=running?"block":"none"; badge.textContent=running; }
    if(S.tracked)pollTracked(false);
    if(currentPage==="jobs")route();
  }catch(e){}
}
async function pollUnanswered(){
  if(!can("unanswered.view"))return;
  try{
    const d=await api("/unanswered?status=new&limit=1");
    const b=$("#nav-uq-badge");
    if(b){ b.style.display=d.total?"block":"none"; b.textContent=d.total; }
  }catch(e){}
}
async function pollHealth(){
  try{
    const d=await api("/health");
    const ok=d.status==="healthy";
    const foot=$(".side-foot");
    if(foot)foot.innerHTML='<span class="health-dot '+(ok?"hok":"hbad")+'"></span><span>'+esc(d.status)+"</span>";
    if(currentPage==="health")route();
  }catch(e){ const foot=$(".side-foot"); if(foot)foot.innerHTML='<span class="health-dot hbad"></span><span>offline</span>'; }
}
async function showNotifications(){
  try{
    const d=await api("/notifications");
    const items=d.items||[];
    const html=items.map(n=>'<div class="notif-item '+(n.read?"":"unread")+'" data-nid="'+esc(n.id)+'"><span class="nd" style="background:'+(n.level==="error"?"var(--red)":n.level==="warning"?"var(--amber)":n.level==="success"?"var(--green)":"var(--primary-3)")+'"></span><div><div class="title">'+esc(n.title)+'</div>'+(n.message?'<div class="msg">'+esc(n.message)+"</div>":"")+'<div class="when">'+fmtTime(n.created_at)+"</div></div></div>").join("")||'<div class="empty">No notifications</div>';
    openDrawer("Notifications",html+'<div style="margin-top:.8rem;display:flex;gap:.6rem"><button class="btn btn-o btn-sm" id="mark-all">Mark all read</button></div>');
    qa("[data-nid]").forEach(el=>el.addEventListener("click",async ()=>{
      try{ await api("/notifications/read",{method:"POST",body:JSON.stringify({ids:[el.dataset.nid]})}); }catch(e){}
      pollNotifs();
    }));
    const mar=$("#mark-all");
    if(mar)mar.addEventListener("click",async ()=>{ try{ await api("/notifications/read",{method:"POST",body:JSON.stringify({})}); }catch(e){} pollNotifs(); closeDrawer(); });
  }catch(e){ toast("Notifications","error",e.message); }
}

/* ---- boot / session restore ---- */
function boot(){
  renderNav();
  $("#user-name").textContent=me.email;
  $("#user-role").textContent=me.role_label;
  $("#user-av").textContent=(me.email||"?").charAt(0).toUpperCase();
  const tc=$("#tenant-chip");
  if(tc&&me.tenant_name){ $("#tenant-name").textContent=me.tenant_name; tc.hidden=false; }
  clearTimers();
  S.ovPoll=0;
  route();
  pollHealth(); pollNotifs(); pollJobs(); pollUnanswered();
  every(30000,pollHealth);
  every(25000,pollNotifs);
  every(15000,pollJobs);
  every(60000,pollUnanswered);
}
function logout(){
  clearTimers();
  store.del("at"); store.del("rt"); me=null; location.hash="";
  $("#app").classList.remove("auth-open"); $("#login").classList.add("open");
}
(function init(){
  const theme=store.get("theme"); if(theme)applyTheme(theme);
  if(store.get("at")){
    api("/me").then(m=>{ me=m; $("#app").classList.add("auth-open"); $("#login").classList.remove("open"); boot(); })
      .catch(()=>logout());
  }else{
    $("#login").classList.add("open");
  }
})();
</script>
</body>
</html>
