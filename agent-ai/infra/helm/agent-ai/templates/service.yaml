apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-ai.name" . }}-api
  labels:
    {{- include "agent-ai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.apiPort }}
      targetPort: {{ .Values.service.apiPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-ai.name" . }}-web
  labels:
    {{- include "agent-ai.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agent-ai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.webPort }}
      targetPort: {{ .Values.service.webPort }}
