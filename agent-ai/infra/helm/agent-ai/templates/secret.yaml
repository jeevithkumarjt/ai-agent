apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-ai.name" . }}-secret
  labels:
    {{- include "agent-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | default (randAlphaNum 32) | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default (randAlphaNum 32) | quote }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | default (randAlphaNum 32) | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  QDRANT_API_KEY: {{ .Values.secrets.qdrantApiKey | quote }}
