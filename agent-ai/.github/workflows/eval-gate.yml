name: Eval Gate

on:
  push:
    branches: [main]

jobs:
  eval:
    name: Golden dataset regression gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://agentai:agentai@localhost:5432/agentai
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentai
          POSTGRES_USER: agentai
          POSTGRES_PASSWORD: agentai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentai" --health-interval 5s --health-timeout 5s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.7
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/api
        run: pip install ".[dev]"
      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: Seed golden questions
        run: python scripts/seed_golden.py --json tests/eval/golden_questions.json
      - name: Run eval gate
        working-directory: apps/api
        run: pytest tests/eval/ -q --eval-gate
      - name: Fail on regression
        if: failure()
        run: echo "::error::Golden dataset regression detected. Do not merge." && exit 1
