  agent-widget.js auto-inits every .aw-root it finds on DOMContentLoaded.

<section class="aw-root">
  <button type="button" class="aw-nav aw-nav-prev" aria-label="Previous scenario">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button type="button" class="aw-nav aw-nav-next" aria-label="Next scenario">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <div class="aw-stage" role="region" aria-label="Talk to an agent — scenario picker"></div>
  <div class="aw-dots" role="tablist" aria-label="Scenario slides"></div>

  <button type="button" class="aw-caption">
    <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 5-10 5z"/></svg>
    <span>Click to speak with an agent</span>
  </button>

  <div class="aw-call-overlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="aw-call-title-label">
    <div class="aw-call-card">
      <div class="aw-call-head">
        <div>
          <div class="aw-call-tag">HEALTHCARE</div>
          <div class="aw-call-title" id="aw-call-title-label">Patient services</div>
        </div>
        <div class="aw-call-status-row">
          <div class="aw-call-status" data-live="false">Connecting</div>
          <button type="button" class="aw-call-close" aria-label="Close call">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <div class="aw-call-body">
        <div class="aw-voice-mode" style="display:flex; flex-direction:column; align-items:center; gap:30px;">
          <div class="aw-call-orb-slot"></div>
          <div class="aw-call-message" aria-live="polite"></div>
        </div>
        <div class="aw-chat-mode" style="display:none; flex-direction:column; width:100%; height:100%;">
          <div class="aw-call-chatlog" role="log" aria-live="polite" aria-label="Chat with agent"></div>
        </div>
      </div>

      <div class="aw-call-foot aw-voice-foot">
        <button type="button" class="aw-hangup-btn" aria-label="End call">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5L21 3M16 3h5v5"/><path d="M3 3l3.5 8L3 14.5a15 15 0 0010 10L16.5 21 21 20.5"/></svg>
        </button>
        <button type="button" class="aw-type-instead">Type instead</button>
      </div>

      <div class="aw-call-foot aw-chat-foot" style="display:none; padding-top: 14px;">
        <div class="aw-call-input-row">
          <label for="aw-chat-input-field" class="aw-sr-only">Type a message</label>
          <textarea class="aw-call-input" id="aw-chat-input-field" rows="1" placeholder="Type a message…"></textarea>
          <button type="button" class="aw-call-send" aria-label="Send message">➤</button>
        </div>
        <button type="button" class="aw-back-to-voice">Switch back to voice</button>
      </div>
    </div>
  </div>
</section>
