<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 185 185" role="img" aria-label="Tryvium AI orb">
  <title>Tryvium AI orb</title>
  <defs>
    <radialGradient id="baseGrad" gradientUnits="userSpaceOnUse" cx="92.5" cy="64.75" fx="92.5" fy="64.75" r="106.375">
      <stop offset="0%" stop-color="#8AD9FF" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#2E9BEE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B4A8C"/>
    </radialGradient>
    <radialGradient id="haloGrad">
      <stop offset="0%" stop-color="rgba(88,185,255,0.4)"/>
      <stop offset="55%" stop-color="rgba(88,185,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(88,185,255,0)"/>
    </radialGradient>
    <radialGradient id="b1">
      <stop offset="0%" stop-color="rgba(138,217,255,0.5)"/>
      <stop offset="60%" stop-color="rgba(46,155,238,0.18)"/>
      <stop offset="100%" stop-color="rgba(46,155,238,0)"/>
    </radialGradient>
    <radialGradient id="b2">
      <stop offset="0%" stop-color="rgba(46,155,238,0.5)"/>
      <stop offset="60%" stop-color="rgba(11,74,140,0.18)"/>
      <stop offset="100%" stop-color="rgba(11,74,140,0)"/>
    </radialGradient>
    <radialGradient id="b3">
      <stop offset="0%" stop-color="rgba(138,217,255,0.5)"/>
      <stop offset="60%" stop-color="rgba(11,74,140,0.18)"/>
      <stop offset="100%" stop-color="rgba(11,74,140,0)"/>
    </radialGradient>
    <radialGradient id="coreGrad">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="32%" stop-color="rgba(138,217,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(138,217,255,0)"/>
    </radialGradient>
    <radialGradient id="shadeGrad" cx="0.5" cy="0.65" fx="0.5" fy="0.65" r="0.625">
      <stop offset="16%" stop-color="rgba(5,8,16,0)"/>
      <stop offset="72%" stop-color="rgba(5,8,16,0.08)"/>
      <stop offset="100%" stop-color="rgba(5,8,16,0.55)"/>
    </radialGradient>
    <radialGradient id="specGrad">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="orbClip">
      <circle cx="92.5" cy="92.5" r="92.5"/>
    </clipPath>
  </defs>

  <!-- step 1 · halo (screen, breathing + periodic idle pulse) -->
  <circle cx="92.5" cy="92.5" r="138.75" fill="url(#haloGrad)" style="mix-blend-mode: screen" opacity="0.2">
    <animate attributeName="opacity" values="0.15;0.22;0.15;0.3;0.15" keyTimes="0;0.2;0.4;0.75;1" dur="9s" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
  </circle>

  <g clip-path="url(#orbClip)">
    <!-- step 2 · base gradient -->
    <circle cx="92.5" cy="92.5" r="92.5" fill="url(#baseGrad)"/>

    <!-- steps 3–4 · orbiting glow blobs + dust motes (elliptical, breathing swell) -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.022;1" dur="4.5s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>

      <g transform="translate(92.5 92.5) scale(1 0.92)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="40 0 0" to="400 0 0" dur="70s" repeatCount="indefinite"/>
          <circle cx="24" cy="0" r="27.75" fill="url(#b1)" opacity="0.55">
            <animate attributeName="opacity" values="0.5;0.68;0.5" dur="5.2s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="120 0 0" to="480 0 0" dur="50s" repeatCount="indefinite"/>
          <circle cx="34" cy="0" r="35" fill="url(#b2)" opacity="0.55">
            <animate attributeName="opacity" values="0.5;0.68;0.5" dur="4.4s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="200 0 0" to="560 0 0" dur="63s" repeatCount="indefinite"/>
          <circle cx="41" cy="0" r="41.6" fill="url(#b3)" opacity="0.55">
            <animate attributeName="opacity" values="0.5;0.68;0.5" dur="5.8s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="300 0 0" to="660 0 0" dur="39s" repeatCount="indefinite"/>
          <circle cx="46" cy="0" r="48" fill="url(#b2)" opacity="0.55">
            <animate attributeName="opacity" values="0.5;0.68;0.5" dur="6.2s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="20 0 0" to="380 0 0" dur="47s" repeatCount="indefinite"/>
          <circle cx="50" cy="0" r="53.6" fill="url(#b1)" opacity="0.55">
            <animate attributeName="opacity" values="0.5;0.68;0.5" dur="3.8s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="250 0 0" to="610 0 0" dur="35s" repeatCount="indefinite"/>
          <circle cx="34" cy="0" r="57.35" fill="url(#b3)" opacity="0.55">
            <animate attributeName="opacity" values="0.5;0.68;0.5" dur="5s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>

      <g transform="translate(92.5 92.5) scale(1 0.9)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="30 0 0" to="390 0 0" dur="35s" repeatCount="indefinite"/>
          <circle cx="46" cy="0" r="2.2" fill="#FFFFFF" opacity="0.18">
            <animate attributeName="opacity" values="0.12;0.26;0.12" dur="3s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="150 0 0" to="510 0 0" dur="21s" repeatCount="indefinite"/>
          <circle cx="58" cy="0" r="1.4" fill="#FFFFFF" opacity="0.18">
            <animate attributeName="opacity" values="0.12;0.26;0.12" dur="4s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="270 0 0" to="630 0 0" dur="15s" repeatCount="indefinite"/>
          <circle cx="66" cy="0" r="1.8" fill="#FFFFFF" opacity="0.18">
            <animate attributeName="opacity" values="0.12;0.26;0.12" dur="2.5s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="80 0 0" to="440 0 0" dur="12s" repeatCount="indefinite"/>
          <circle cx="72" cy="0" r="1.3" fill="#FFFFFF" opacity="0.18">
            <animate attributeName="opacity" values="0.12;0.26;0.12" dur="3.6s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="200 0 0" to="560 0 0" dur="10.5s" repeatCount="indefinite"/>
          <circle cx="76" cy="0" r="2.4" fill="#FFFFFF" opacity="0.18">
            <animate attributeName="opacity" values="0.12;0.26;0.12" dur="4.4s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>
    </g>

    <!-- step 5 · core glow (lighter, breathing) -->
    <circle cx="92.5" cy="92.5" r="55.5" fill="url(#coreGrad)" style="mix-blend-mode: screen" opacity="0.46">
      <animate attributeName="opacity" values="0.4;0.52;0.4" dur="4.5s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </circle>

    <!-- step 6 · bottom shade -->
    <circle cx="92.5" cy="92.5" r="92.5" fill="url(#shadeGrad)"/>

    <!-- step 7 · periodic idle pulse ripple (expanding rings) -->
    <g fill="none" stroke="#FFFFFF" stroke-width="1.4" style="mix-blend-mode: screen">
      <circle cx="92.5" cy="92.5" r="22" opacity="0.22">
        <animate attributeName="r" values="22;105" dur="8s" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0" dur="8s" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" repeatCount="indefinite"/>
      </circle>
      <circle cx="92.5" cy="92.5" r="22" opacity="0.22">
        <animate attributeName="r" values="22;105" dur="8s" begin="4s" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0" dur="8s" begin="4s" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- step 8 · rim -->
  <circle cx="92.5" cy="92.5" r="91.9" fill="none" stroke="rgba(18,24,40,0.16)" stroke-width="1.25"/>

  <!-- step 9 · connecting sweep arc (screen, scanning) -->
  <circle cx="92.5" cy="92.5" r="105.5" fill="none" stroke="rgba(88,185,255,0.4)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="464 663" style="mix-blend-mode: screen" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="663;0;663" dur="24s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    <animate attributeName="r" values="98.5;112.5;98.5" dur="24s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
  </circle>

  <!-- step 10 · specular highlight (screen, upper-left, breathing) -->
  <g transform="translate(92.5 92.5) translate(-31.45 -35.15) scale(1 0.82) rotate(-28.65)">
    <circle cx="0" cy="0" r="57.35" fill="url(#specGrad)" style="mix-blend-mode: screen" opacity="0.7">
      <animate attributeName="opacity" values="0.65;0.78;0.65" dur="5s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
