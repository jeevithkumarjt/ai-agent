<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs>
<radialGradient id="g" cx="35%" cy="30%">
<stop offset="0%" stop-color="#d8c8ff"/>
<stop offset="55%" stop-color="#8b5cf6"/>
<stop offset="100%" stop-color="#312e81"/>
</radialGradient>
<filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
<style>
.p{animation:f 4s ease-in-out infinite}
.l{fill:none;stroke:#d7c7ff;stroke-width:4;stroke-linecap:round;opacity:.55}
.loader{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:36 500;animation:spin 1.8s linear infinite}
@keyframes spin{to{stroke-dashoffset:-536}}
@keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</defs>
<g class="p">
<circle cx="200" cy="200" r="150" fill="url(#g)"/>
<ellipse cx="150" cy="120" rx="70" ry="35" fill="#fff" opacity=".15"/>
<path class="l" d="M110 170c40-35 120-35 180 0"/>
<path class="l" d="M130 230c35-20 95-20 140 0"/>
<circle cx="165" cy="155" r="3" fill="#fff"><animate attributeName="cy" values="155;145;155" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="230" cy="215" r="2.5" fill="#fff"><animate attributeName="cx" values="230;238;230" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="185" cy="250" r="2" fill="#fff"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
<path class="loader" d="M200 62 A138 138 0 1 1 199.9 62"/>
</g>
</svg>