<!-- ═══════════════════════════════════════════════════
     STICKY TOC — FIXED SYNC + SMOOTH INDICATOR
     ═══════════════════════════════════════════════════ -->

<style>
.wp-toc{position:relative;padding-left:44px;max-width:220px}
.wp-toc-track{position:absolute;left:18px;top:0;width:2px;height:100%}
.wp-toc-track::before{content:"";position:absolute;inset:0;background:#e4e4e7;border-radius:2px}
.wp-toc-fill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,#ff6b00,#ff9a44);border-radius:2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.wp-toc-dot{position:absolute;left:-3px;top:0;width:8px;height:8px;border-radius:50%;background:#ff6b00;box-shadow:0 0 0 5px rgba(255,107,0,.12),0 2px 8px rgba(255,107,0,.25);transition:transform .5s cubic-bezier(.22,1,.36,1);will-change:transform}
.wp-toc ul{list-style:none;margin:0;padding:0}
.wp-toc li{margin:20px 0;position:relative}
.wp-toc a{color:#a1a1aa;text-decoration:none;font-size:14px;font-weight:500;transition:color .3s,padding-left .3s;display:inline-block}
.wp-toc a:hover{color:#52525b;padding-left:4px}
.wp-toc li.active a{color:#18181b;font-weight:700;padding-left:6px}
</style>

<nav class="wp-toc" aria-label="Page navigation">
  <div class="wp-toc-track">
    <span class="wp-toc-fill"></span>
    <span class="wp-toc-dot"></span>
  </div>
  <ul>
    <li class="active"><a href="#intro">Introduction</a></li>
    <li><a href="#intro2">Benefits</a></li>
    <li><a href="#intro3">Features</a></li>
    <li><a href="#intro4">Pricing</a></li>
    <li><a href="#intro5">FAQ</a></li>
  </ul>
</nav>

<script>
(function(){
  var dot=document.querySelector(".wp-toc-dot");
  var fill=document.querySelector(".wp-toc-fill");
  var items=document.querySelectorAll(".wp-toc li");
  var anchors=document.querySelectorAll(".wp-toc a");
  var sections=[];
  var cur=-1;
  var ticking=false;

  items.forEach(function(li){
    var a=li.querySelector("a");
    if(a)sections.push(document.getElementById(a.getAttribute("href").replace("#","")));
  });

  function moveDot(i){
    if(!dot||!fill||!items[i])return;
    var p=items[i].offsetTop+items[i].offsetHeight/2-4;
    dot.style.transform="translateY("+p+"px)";
    fill.style.height=(p+4)+"px";
  }

  function setActive(i){
    if(i===cur||i<0||i>=items.length)return;
    items[cur]>=0&&items[cur]&&items[cur].classList.remove("active");
    cur=i;
    items[cur].classList.add("active");
    moveDot(cur);
  }

  function findCurrent(){
    var best=0;
    var y=window.pageYOffset;
    sections.forEach(function(s,i){
      if(!s)return;
      if(y>=s.offsetTop-180)best=i;
    });
    return best;
  }

  function onScroll(){
    setActive(findCurrent());
    ticking=false;
  }

  anchors.forEach(function(a){
    a.addEventListener("click",function(e){
      var id=this.getAttribute("href").replace("#","");
      var target=document.getElementById(id);
      if(!target)return;
      e.preventDefault();
      var idx=-1;
      sections.forEach(function(s,i){if(s&&s.id===id)idx=i;});
      if(idx>=0)setActive(idx);
      var top=target.offsetTop-80;
      window.scrollTo({top:top,behavior:"smooth"});
    });
  });

  window.addEventListener("scroll",function(){
    if(!ticking){requestAnimationFrame(onScroll);ticking=true;}
  },{passive:true});

  window.addEventListener("resize",function(){requestAnimationFrame(function(){setActive(findCurrent());});});

  setActive(0);
})();
</script>
