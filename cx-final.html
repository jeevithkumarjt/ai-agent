<style>
.voice-wrapper{position:relative;display:inline-flex}
.voice{position:relative!important;display:inline-flex}
.voice.is-playing .elementor-icon{background:#222!important}
.voice.is-playing svg,.voice.is-playing svg path{fill:#fff!important;stroke:#fff!important}
.cx-voice-toolbar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:#1a1a1a;border-radius:40px;padding:8px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:2147483647;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.cx-voice-toolbar.active{display:flex}
.cx-vt-btn{width:36px;height:36px;border:none;border-radius:50%;background:transparent;color:#ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s;flex-shrink:0}
.cx-vt-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.cx-vt-btn.playing{color:#4fc3f7}
.cx-vt-divider{width:1px;height:20px;background:rgba(255,255,255,.15);margin:0 4px;flex-shrink:0}
.cx-vt-select{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;font-size:12px;padding:4px 8px;border-radius:16px;cursor:pointer;outline:none;flex-shrink:0}
.cx-vt-select option{background:#1a1a1a;color:#fff}
.cx-vt-label{color:#888;font-size:11px;flex-shrink:0}
.elementor-widget-icon.voice,.elementor-widget-icon.voice .elementor-widget-container,.elementor-element:has(> .voice){overflow:visible!important}
.cx-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2147483647;padding:20px;backdrop-filter:blur(4px)}
.cx-modal{background:#fff;border-radius:16px;padding:24px;max-width:400px;width:100%;position:relative;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:cxModalIn .2s ease}
@keyframes cxModalIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.cx-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;line-height:1;cursor:pointer;color:#999;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:.15s}
.cx-modal-close:hover{background:#f0f0f0;color:#333}
.cx-modal-title{margin:0 0 16px;font-size:16px;font-weight:600;color:#222}
.cx-share-row{display:flex;gap:10px;margin-bottom:16px}
.cx-share-icon{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f5f5f5;color:#333;text-decoration:none;font-size:14px;font-weight:600;transition:.15s}
.cx-share-icon:hover{background:#e8e8e8;transform:translateY(-1px)}
.cx-copy-row{display:flex;gap:8px}
.cx-copy-input{flex:1;padding:8px 12px;border:1px solid #e0e0e0;border-radius:8px;font-size:13px;color:#555}
.cx-copy-btn{padding:8px 14px;border:none;border-radius:8px;background:#222;color:#fff;cursor:pointer;font-size:13px;transition:.15s}
.cx-copy-btn:hover{background:#333}
.cx-summary-list{margin:0;padding-left:0;list-style:none}
.cx-summary-list li{padding:8px 0;font-size:14px;color:#333;border-bottom:1px solid #f0f0f0}
.cx-summary-list li:last-child{border-bottom:none}
.tts-active{background:#fff8e1;border-left:3px solid #ff9800;padding-left:12px!important;transition:.3s}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){var c=document.getElementById('voice'),v=document.querySelector('.voice');if(!v)return;var t=document.createElement('div');t.className='cx-voice-toolbar';t.innerHTML='<button class="cx-vt-btn" id="cxPlay" title="Play">&#9654;</button><button class="cx-vt-btn" id="cxPause" title="Pause">&#10074;&#10074;</button><button class="cx-vt-btn" id="cxResume" title="Resume">&#9654;</button><button class="cx-vt-btn" id="cxStop" title="Stop">&#9632;</button><div class="cx-vt-divider"></div><span class="cx-vt-label">Voice</span><select class="cx-vt-select" id="cxVoiceSelect"><option value="Jenny">Jenny</option><option value="Aria">Aria</option><option value="Sonia">Sonia</option><option value="David">David</option><option value="Guy">Guy</option></select>';document.body.appendChild(t);v.addEventListener('click',function(e){e.stopPropagation();t.classList.toggle('active')});document.addEventListener('click',function(e){if(!t.contains(e.target)&&e.target!==v&&!v.contains(e.target))t.classList.remove('active')});var s='Jenny';t.querySelector('#cxVoiceSelect').addEventListener('change',function(){s=this.value});function g(){var a=speechSynthesis.getVoices();return a.find(function(x){return x.name.indexOf(s)!==-1})||a[0]}var q=[],i=0,sp=false,pa=false;function b(){q=[];if(!c)return;c.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li').forEach(function(el){var x=el.innerText.trim();if(x.length>2)q.push({element:el,text:x})})}function k(){if(!sp)return;if(i>=q.length){st();return}var it=q[i];document.querySelectorAll('.tts-active').forEach(function(e){e.classList.remove('tts-active')});it.element.classList.add('tts-active');it.element.scrollIntoView({behavior:'smooth',block:'center'});var u=new SpeechSynthesisUtterance(it.text);u.voice=g();u.rate=1;u.pitch=1;u.onend=function(){i++;k()};speechSynthesis.speak(u)}function pl(){speechSynthesis.cancel();b();i=0;sp=true;pa=false;v.classList.add('is-playing');t.querySelector('#cxPlay').classList.add('playing');k()}function pa2(){if(sp){speechSynthesis.pause();pa=true}}function re(){if(pa){speechSynthesis.resume();pa=false}}function st(){speechSynthesis.cancel();sp=false;pa=false;i=0;v.classList.remove('is-playing');t.querySelector('#cxPlay').classList.remove('playing');document.querySelectorAll('.tts-active').forEach(function(e){e.classList.remove('tts-active')})}t.querySelector('#cxPlay').addEventListener('click',pl);t.querySelector('#cxPause').addEventListener('click',pa2);t.querySelector('#cxResume').addEventListener('click',re);t.querySelector('#cxStop').addEventListener('click',st);document.addEventListener('keydown',function(e){if(e.key==='Escape'){st();t.classList.remove('active')}})});function openModal(h){var o=document.createElement('div');o.className='cx-modal-overlay';o.innerHTML='<div class="cx-modal"><button class="cx-modal-close" aria-label="Close">&times;</button>'+h+'</div>';document.body.appendChild(o);o.addEventListener('click',function(e){if(e.target===o)cl()});o.querySelector('.cx-modal-close').addEventListener('click',cl);function esc(e){if(e.key==='Escape')cl()}document.addEventListener('keydown',esc);function cl(){o.remove();document.removeEventListener('keydown',esc)}return o}document.addEventListener('DOMContentLoaded',function(){var sb=document.querySelector('.share');if(sb)sb.addEventListener('click',function(){var u=window.location.href;var o=openModal('<h3 class="cx-modal-title">Share this page</h3><div class="cx-share-row"><a class="cx-share-icon" target="_blank" href="https://www.linkedin.com/sharing/share-offsite/?url='+encodeURIComponent(u)+'">in</a><a class="cx-share-icon" target="_blank" href="https://twitter.com/intent/tweet?url='+encodeURIComponent(u)+'">X</a><a class="cx-share-icon" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(u)+'">f</a></div><div class="cx-copy-row"><input type="text" readonly class="cx-copy-input" id="cxCopyInput"><button class="cx-copy-btn" id="cxCopyBtn">Copy</button></div>');var inp=o.querySelector('#cxCopyInput');inp.value=u;o.querySelector('#cxCopyBtn').addEventListener('click',function(){var b=this;inp.select();navigator.clipboard.writeText(inp.value).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy'},1500)})})});var sm=document.querySelector('.summary');if(sm)sm.addEventListener('click',function(e){e.preventDefault();var cr=document.getElementById('voice');var ps=document.getElementById('page-summary');var bh;if(ps){bh=ps.innerHTML}else{var hd=cr?cr.querySelectorAll('h2'):[];var it='';for(var x=0;x<hd.length;x++)it+='<li>'+hd[x].textContent.trim()+'</li>';bh='<ul class="cx-summary-list">'+it+'</ul>'}openModal('<h3 class="cx-modal-title">Quick summary</h3><div class="cx-summary-body">'+bh+'</div>')})});
</script>
