<!-- ONE BLOCK VERSION — paste this into a single Custom HTML block -->
<style>
.wp-toc{position:relative;padding-left:44px;max-width:220px}
.wp-toc-track{position:absolute;left:18px;top:0;width:2px;height:100%}
.wp-toc-track::before{content:"";position:absolute;inset:0;background:#e4e4e7;border-radius:2px}
.wp-toc-fill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,#ff6b00,#ff9a44);border-radius:2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.wp-toc-dot{position:absolute;left:-3px;top:0;width:8px;height:8px;border-radius:50%;background:#ff6b00;box-shadow:0 0 0 5px rgba(255,107,0,.12),0 2px 8px rgba(255,107,0,.25);transition:transform .5s cubic-bezier(.22,1,.36,1);will-change:transform}
.wp-toc ul{list-style:none;margin:0;padding:0}
.wp-toc li{margin:20px 0;position:relative}
.wp-toc a{color:#a1a1aa;text-decoration:none;font-size:14px;font-weight:500;transition:color .3s,padding-left .3s;display:inline-block}
.wp-toc a:hover{color:#52525b;padding-left:4px}
.wp-toc li.active a{color:#18181b;font-weight:700;padding-left:6px}
</style>
<nav class="wp-toc" aria-label="Page navigation">
<div class="wp-toc-track"><span class="wp-toc-fill"></span><span class="wp-toc-dot"></span></div>
<ul>
<li class="active"><a href="#intro">Introduction</a></li>
<li><a href="#intro2">Benefits</a></li>
<li><a href="#intro3">Features</a></li>
<li><a href="#intro4">Pricing</a></li>
<li><a href="#intro5">FAQ</a></li>
</ul>
</nav>
<script>
(function(){var d=document.querySelector(".wp-toc-dot"),f=document.querySelector(".wp-toc-fill"),lis=document.querySelectorAll(".wp-toc li"),c=-1,t=0;function pos(i){if(!d||!f||!lis[i])return;var p=lis[i].offsetTop+lis[i].offsetHeight/2-4;d.style.transform="translateY("+p+"px)";f.style.height=(p+4)+"px";}function go(i){if(i===c||i<0||i>=lis.length)return;if(c>=0&&lis[c])lis[c].classList.remove("active");c=i;lis[c].classList.add("active");pos(c);}function cur(){var b=0;lis.forEach(function(l,i){var a=l.querySelector("a");if(!a)return;var s=document.getElementById(a.getAttribute("href").replace("#",""));if(s&&window.pageYOffset>=s.offsetTop-180)b=i;});return b;}document.querySelectorAll(".wp-toc a").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();var id=this.getAttribute("href").replace("#",""),tg=document.getElementById(id);if(!tg)return;lis.forEach(function(l,i){if(l.querySelector("a").getAttribute("href")==="#"+id)go(i);});window.scrollTo({top:tg.offsetTop-80,behavior:"smooth"});});});window.addEventListener("scroll",function(){if(!t){requestAnimationFrame(function(){go(cur());t=0;});t=1;}},{passive:true});window.addEventListener("resize",function(){requestAnimationFrame(function(){go(cur());});});go(0);})();
</script>
