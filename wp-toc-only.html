<!-- ═══════════════════════════════════════════════════
     STICKY TOC — LEFT SIDEBAR ONLY
     Paste into a WordPress "Custom HTML" block
     ═══════════════════════════════════════════════════ -->

<style>
.wp-toc{position:relative;padding-left:44px;max-width:220px}
.wp-toc-track{position:absolute;left:18px;top:0;width:2px;height:100%}
.wp-toc-track::before{content:"";position:absolute;inset:0;background:#e4e4e7;border-radius:2px}
.wp-toc-fill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,#ff6b00,#ff9a44);border-radius:2px;transition:height .5s cubic-bezier(.22,1,.36,1)}
.wp-toc-dot{position:absolute;left:-3px;top:0;width:8px;height:8px;border-radius:50%;background:#ff6b00;box-shadow:0 0 0 5px rgba(255,107,0,.12),0 2px 8px rgba(255,107,0,.25);transition:transform .5s cubic-bezier(.22,1,.36,1);will-change:transform}
.wp-toc ul{list-style:none;margin:0;padding:0}
.wp-toc li{margin:20px 0;position:relative}
.wp-toc a{color:#a1a1aa;text-decoration:none;font-size:14px;font-weight:500;transition:color .3s,padding-left .3s;display:inline-block}
.wp-toc a:hover{color:#52525b;padding-left:4px}
.wp-toc li.active a{color:#18181b;font-weight:700;padding-left:6px}
</style>

<nav class="wp-toc" aria-label="Page navigation">
  <div class="wp-toc-track">
    <span class="wp-toc-fill"></span>
    <span class="wp-toc-dot"></span>
  </div>
  <ul>
    <li class="active"><a href="#intro">Introduction</a></li>
    <li><a href="#benefits">Benefits</a></li>
    <li><a href="#features">Features</a></li>
    <li><a href="#pricing">Pricing</a></li>
    <li><a href="#faq">FAQ</a></li>
  </ul>
</nav>

<script>
(function(){
  var dot  = document.querySelector(".wp-toc-dot");
  var fill = document.querySelector(".wp-toc-fill");
  var items = document.querySelectorAll(".wp-toc li");
  var sections = [];
  items.forEach(function(li){
    var a = li.querySelector("a");
    if(a) sections.push(document.getElementById(a.getAttribute("href").slice(1)));
  });

  var cur = 0, ticking = false;

  function sync(){
    var y = window.pageYOffset;
    var now = 0;
    sections.forEach(function(s,i){ if(s && s.getBoundingClientRect().top <= 180) now = i; });
    if(now !== cur){ items[cur].classList.remove("active"); items[now].classList.add("active"); cur = now; }
    if(dot && fill && items[cur]){
      var pos = items[cur].offsetTop + items[cur].offsetHeight/2 - 4;
      dot.style.transform = "translateY("+pos+"px)";
      fill.style.height = (pos+4)+"px";
    }
    ticking = false;
  }

  sync();
  window.addEventListener("scroll", function(){ if(!ticking){ requestAnimationFrame(sync); ticking = true; } }, {passive:true});
  window.addEventListener("resize", function(){ requestAnimationFrame(sync); });
})();
</script>
