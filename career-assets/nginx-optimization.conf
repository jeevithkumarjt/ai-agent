# ============================================================
#  Server-side performance & security for Nginx
#  Paste into the `server { }` block (or a shared conf file)
# ============================================================

# --- Gzip + Brotli compression -------------------------------
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json
    application/xml application/rss+xml
    image/svg+xml font/woff2;

# If Nginx compiled with the brotli module:
# brotli on;
# brotli_comp_level 6;
# brotli_min_length 1024;
# brotli_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml font/woff2;

# --- Cache-Control -------------------------------------------
location ~* \.(css|js|woff2|webp|avif|png|jpe?g|gif|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache, must-revalidate";
}

# --- Security headers ----------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
